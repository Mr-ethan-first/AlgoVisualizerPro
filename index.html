        </div>
    </header>

    <!-- 主体布局 -->
    <div class="app-body">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">算法分类</span>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-level="all">全部</button>
                    <button class="filter-tab" data-level="P0">P0</button>
                    <button class="filter-tab" data-level="P1">P1</button>
                    <button class="filter-tab" data-level="P2">P2</button>
                    <button class="filter-tab" data-level="P3">P3</button>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav" aria-label="算法导航"></nav>
            <div class="sidebar-footer">
                <div class="progress-mini">
                    <span>已实现</span>
                    <strong id="implProgress">0 / 0</strong>
                </div>
            </div>
        </aside>
        <div class="sidebar-resizer" id="sidebarResizer"></div>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 算法标题栏（含控制栏，吸顶显示） -->
            <div class="algo-header">
                <div class="algo-title-block">
                    <h1 class="algo-title" id="algoTitle">请选择算法</h1>
                    <p class="algo-subtitle" id="algoSubtitle">从左侧导航选择一个算法开始可视化</p>
                    <p class="algo-mnemonic" id="algoMnemonic" style="display:none"></p>
                </div>
                <!-- 控制栏：移到大标题右侧，始终可见 -->
                <section class="controls">
                    <div class="controls-group">
                        <button class="ctrl-btn" id="firstBtn" title="跳到开头 (Home)" aria-label="跳到开头">
                            <svg viewBox="0 0 16 16"><path fill="currentColor" d="M3 2.75A.75.75 0 0 1 3.75 2h.5a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75V2.75Zm3.06 5.31 7.72-5.18a.5.5 0 0 1 .78.41v10.42a.5.5 0 0 1-.78.42L6.06 8.5a.5.5 0 0 1 0-.83Z"/></svg>
                        </button>
                        <button class="ctrl-btn" id="prevBtn" title="后退一步 (←)" aria-label="后退一步">
                            <svg viewBox="0 0 16 16"><path fill="currentColor" d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z"/></svg>
                        </button>
                        <button class="ctrl-btn ctrl-play" id="playBtn" title="播放/暂停 (Space)" aria-label="播放或暂停">
                            <svg class="play-icon" viewBox="0 0 16 16"><path fill="currentColor" d="M3.5 2.5a.5.5 0 0 1 .76-.43l8.5 5.5a.5.5 0 0 1 0 .86l-8.5 5.5a.5.5 0 0 1-.76-.43v-11Z"/></svg>
                            <svg class="pause-icon" style="display:none" viewBox="0 0 16 16"><path fill="currentColor" d="M3.5 2h3v12h-3V2Zm6 0h3v12h-3V2Z"/></svg>
                        </button>
                        <button class="ctrl-btn" id="nextBtn" title="前进一步 (→)" aria-label="前进一步">
                            <svg viewBox="0 0 16 16"><path fill="currentColor" d="M6.22 4.22a.75.75 0 0 0 0 1.06L8.94 8l-2.72 2.72a.75.75 0 1 0 1.06 1.06l3.25-3.25a.75.75 0 0 0 0-1.06L7.28 4.22a.75.75 0 0 0-1.06 0Z"/></svg>
                        </button>
                        <button class="ctrl-btn" id="lastBtn" title="跳到结尾 (End)" aria-label="跳到结尾">
                            <svg viewBox="0 0 16 16"><path fill="currentColor" d="M12 2.75a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75V2.75ZM3.44 2.88l7.72 5.18a.5.5 0 0 1 0 .83L3.44 14.07a.5.5 0 0 1-.78-.42V3.3a.5.5 0 0 1 .78-.42Z"/></svg>
                        </button>
                    </div>
                    <div class="controls-group controls-speed">
                        <span class="speed-label">速度</span>
                        <button class="speed-step" id="speedMinus" title="减速 -0.25x" aria-label="减速">−</button>
                        <span class="speed-min">0.25x</span>
                        <div class="speed-slider-wrap">
                            <input type="range" id="speedSlider" min="0" max="100" value="50" step="1" />
                            <div class="speed-track">
                                <div class="speed-fill" id="speedFill"></div>
                            </div>
                        </div>
                        <span class="speed-max">4x</span>
                        <button class="speed-step" id="speedPlus" title="加速 +0.25x" aria-label="加速">+</button>
                        <span class="speed-value" id="speedValue">1.0x</span>
                    </div>
                    <div class="controls-group">
                        <button class="btn btn-sm btn-ghost" id="resetBtn" title="重置">
                            <svg viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M502.714987 58.258904l-126.531056-54.617723a52.797131 52.797131 0 0 0-41.873587 96.855428A447.865322 447.865322 0 0 0 392.02307 946.707184a61.535967 61.535967 0 0 0 13.83649 1.820591 52.797131 52.797131 0 0 0 13.65443-103.773672 342.453118 342.453118 0 0 1-31.678278-651.771485l-8.374718 19.480321a52.615072 52.615072 0 0 0 27.855039 69.182448 51.522718 51.522718 0 0 0 20.572675 4.369418A52.797131 52.797131 0 0 0 476.498481 254.882703L530.205907 127.441352a52.979191 52.979191 0 0 0-27.49092-69.182448zM962.960326 509.765407A448.775617 448.775617 0 0 0 643.992829 68.090094a52.797131 52.797131 0 1 0-30.403866 101.042786A342.635177 342.635177 0 0 1 674.578753 801.059925a52.615072 52.615072 0 0 0-92.30395-50.612422l-71.913335 117.246043a52.433013 52.433013 0 0 0 17.295612 72.82363l117.063985 72.823629a52.797131 52.797131 0 1 0 54.617722-89.755123l-16.021198-10.013249A448.593558 448.593558 0 0 0 962.960326 509.765407z"/></svg>
                            重置
                        </button>
                    </div>
                </section>
                <div class="algo-meta" id="algoMeta">
                    <span class="badge" data-type="category">分类</span>
                    <span class="badge" data-type="complexity">时间复杂度</span>
                    <span class="badge" data-type="level">P0</span>
                </div>
            </div>

            <!-- 画布区域 -->
            <section class="canvas-section">
                <div class="canvas-toolbar">
                    <div class="canvas-label" id="canvasLabel">可视化区域</div>
                    <div class="canvas-tools">
                        <label class="data-input-group" id="dataInputGroup" style="display:none">
                            <span class="data-label">数据</span>
                            <input type="text" id="dataInput" placeholder="例：5,3,8,1,2,7,4,6" />
                            <button class="btn btn-sm btn-primary" id="applyDataBtn">应用</button>
                        </label>
                        <button class="btn btn-sm btn-ghost" id="randomDataBtn" style="display:none" title="随机数据">

                            随机
                        </button>
                    </div>
                </div>
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="mainCanvas" aria-label="算法可视化画布"></canvas>
                    <div class="canvas-empty" id="canvasEmpty">
                        <div class="empty-illustration">
                            <svg viewBox="0 0 240 160" aria-hidden="true">
                                <defs>
                                    <linearGradient id="eg" x1="0" y1="0" x2="1" y2="1">
                                        <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6"/>
                                        <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.6"/>
                                    </linearGradient>
                                </defs>
                                <rect x="40" y="100" width="28" height="40" rx="4" fill="url(#eg)"/>
                                <rect x="76" y="70" width="28" height="70" rx="4" fill="url(#eg)" opacity="0.7"/>
                                <rect x="112" y="50" width="28" height="90" rx="4" fill="url(#eg)" opacity="0.5"/>
                                <rect x="148" y="80" width="28" height="60" rx="4" fill="url(#eg)" opacity="0.7"/>
                                <rect x="184" y="35" width="28" height="105" rx="4" fill="url(#eg)" opacity="0.5"/>
                            </svg>
                        </div>
                        <p class="empty-title">选择一个算法开启可视化之旅</p>
                        <p class="empty-desc">支持单步执行 / 变速播放 / 代码高亮联动</p>
                    </div>
                </div>
            </section>
